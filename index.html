<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATOMIC | Hyperstructure</title>
    <style>
        body {
            margin: 0;
            overflow: hidden; /* Scrollni yo'qotamiz */
            background-color: #000;
            font-family: 'Courier New', monospace;
        }
        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        /* Kirish matni va tugmalar uchun CSS qatlami */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none; /* 3D olamga sichqoncha o'tishi uchun */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #fff;
            text-align: center;
        }
        #main-title {
            font-size: 3rem;
            letter-spacing: 0.5em;
            text-transform: uppercase;
            margin-bottom: 1rem;
            text-shadow: 0 0 20px rgba(255,255,255,0.5);
            pointer-events: auto;
        }
        .subtitle {
            font-size: 1rem;
            opacity: 0.7;
            margin-bottom: 2rem;
            pointer-events: auto;
        }
        /* Oddiy navigatsiya misoli (keyinchalik 3D ga o'tkaziladi) */
        .nav-links {
            display: flex;
            gap: 20px;
            pointer-events: auto;
        }
        .nav-item {
            color: #aaa;
            text-decoration: none;
            border: 1px solid #555;
            padding: 10px 20px;
            transition: all 0.3s;
            font-size: 0.8rem;
            letter-spacing: 0.2em;
        }
        .nav-item:hover {
            color: #fff;
            border-color: #fff;
            box-shadow: 0 0 15px rgba(255,255,255,0.5);
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="ui-layer">
        <h1 id="main-title">ΛTOMIC</h1>
        <p class="subtitle">"Tizim mustaqil. Anglash — ixtiyoriy."</p>
        
        <div class="nav-links">
           <a href="#" class="nav-item">CHANNELS</a>
           <a href="#" class="nav-item">BOTS</a>
        </div>
        
         <footer style="position: absolute; bottom: 20px; font-size: 10px; opacity: 0.5;">
            CREATED BY TAPLINK CREATOR
        </footer>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // --- 3D OLAMNI YARATISH ---
        let scene, camera, renderer, coreObject, particlesMesh;
        let mouseX = 0, mouseY = 0;

        function init() {
            // 1. Sahna va Kamera
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x000000, 0.0008); // Tuman effekti

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 5;

            // 2. Renderer (Chizuvchi)
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            // --- MARKAZIY "ATOMIC" YADROSI (Murakkab Figura) ---
            // Icosahedron - ko'p qirrali shakl
            const geometry = new THREE.IcosahedronGeometry(1.5, 1); 
            const material = new THREE.MeshBasicMaterial({ 
                color: 0xffffff, 
                wireframe: true, // Faqat qirralari ko'rinsin
                transparent: true,
                opacity: 0.8
            });
            coreObject = new THREE.Mesh(geometry, material);
            scene.add(coreObject);

            // Yadroning ichki qismi (Yorug'lik)
            const innerGeo = new THREE.IcosahedronGeometry(0.8, 2);
            const innerMat = new THREE.MeshBasicMaterial({ color: 0xffffff, wireframe: false });
            const innerCore = new THREE.Mesh(innerGeo, innerMat);
            coreObject.add(innerCore); // Ichiga joylashtiramiz

            // --- ZARRACHALAR (Kosmosdagi changlar) ---
            const particlesGeometry = new THREE.BufferGeometry();
            const particlesCount = 2000;
            const posArray = new Float32Array(particlesCount * 3);

            for(let i = 0; i < particlesCount * 3; i++) {
                // Tasodifiy joylashuv (-5 dan +5 gacha)
                posArray[i] = (Math.random() - 0.5) * 10;
            }
            particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
            const particlesMaterial = new THREE.PointsMaterial({
                size: 0.005,
                color: 0xaaaaaa,
                transparent: true,
                opacity: 0.5,
                blending: THREE.AdditiveBlending
            });
            particlesMesh = new THREE.Points(particlesGeometry, particlesMaterial);
            scene.add(particlesMesh);

            // --- HODISALAR ---
            document.addEventListener('mousemove', onDocumentMouseMove);
            window.addEventListener('resize', onWindowResize);
        }

        // Sichqoncha harakati
        function onDocumentMouseMove(event) {
            mouseX = (event.clientX - window.innerWidth / 2) / 100;
            mouseY = (event.clientY - window.innerHeight / 2) / 100;
        }

        // Ekran o'lchami o'zgarganda
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // --- ANIMATSIYA LOOP (4D Harakat) ---
        function animate() {
            requestAnimationFrame(animate);

            const time = Date.now() * 0.0005; // Vaqt faktori

            // Yadroning aylanishi
            coreObject.rotation.x += 0.001;
            coreObject.rotation.y += 0.002;
            
            // Yadroning "nafas olishi" (kengayib-qisqarishi)
            const scale = 1 + Math.sin(time * 2) * 0.05;
            coreObject.scale.set(scale, scale, scale);

            // Zarrachalarning harakati (sekin aylanish)
            particlesMesh.rotation.y = time * 0.1;
            // Sichqonchaga reaksiya (parallax effekti)
            particlesMesh.rotation.x += (mouseY * 0.05 - particlesMesh.rotation.x) * 0.05;
            particlesMesh.rotation.y += (mouseX * 0.05 - particlesMesh.rotation.y) * 0.05;

            camera.lookAt(scene.position);
            renderer.render(scene, camera);
        }

        // Ishga tushirish
        init();
        animate();
    </script>
</body>
</html>
